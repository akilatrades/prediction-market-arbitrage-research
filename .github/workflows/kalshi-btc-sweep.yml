name: Kalshi BTC strategy sweep
on:
  push:
    branches: [main]
    paths:
      - "research/kalshi_btc_strategy_sweep.py"
      - ".github/workflows/kalshi-btc-sweep.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kalshi-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate independent research
        run: python -m py_compile research/kalshi_btc_strategy_sweep.py
      - name: Execute Kalshi public historical BTC quote research
        env:
          MAX_KALSHI_MARKETS: "320"
        run: python -u research/kalshi_btc_strategy_sweep.py
      - name: Preserve raw numeric strategy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-btc-strategy-sweep
          path: outputs/kalshi_btc_strategy_sweep.json
          if-no-files-found: warn
          retention-days: 30
