name: BTC 15m Polymarket execution research
on:
  push:
    branches: [main]
    paths:
      - "research/btc_execution_backtest.py"
      - ".github/workflows/btc-execution-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execution-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only data readers
        run: python -m pip install pandas pyarrow
      - name: Compile research script
        run: python -m py_compile research/btc_execution_backtest.py
      - name: Run market-quote-aligned taker and maker scenarios
        run: python research/btc_execution_backtest.py
      - name: Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-execution-research
          path: outputs/btc_prediction_execution_one_day.json
          if-no-files-found: warn
          retention-days: 30
