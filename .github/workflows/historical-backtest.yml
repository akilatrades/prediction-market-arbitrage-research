name: Historical arbitrage quote research
on:
  push:
    branches: [main]
    paths:
      - "arb_research/**"
      - "tests/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate formulas and safety guardrails
        run: python -m unittest discover -s tests -v
      - name: Install independent research data readers
        run: python -m pip install pandas pyarrow
      - name: Copy published 2025-26 Kalshi public price archive (read-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/archive_copy
          # Pin the archive to a historic source commit for reproducibility.
          # This only copies public DATA; no trading bot code or credentials.
          SNAPSHOT="c29873bd0caab66ad03e76994d8f661d6e7d65c3"
          PREFIX="https://raw.githubusercontent.com/akilatrades/sports-market-maker"
          for SERIES in KXNBAPTS KXNBAREB KXNBAAST KXNBA3PT; do
            for KIND in markets candles; do
              FILENAME="${KIND}_${SERIES}.parquet"
              curl -fSL --retry 3 --retry-delay 2 \
                "${PREFIX}/${SNAPSHOT}/data/kalshi_history/${FILENAME}" \
                -o "data/archive_copy/${FILENAME}"
            done
          done
      - name: Import authentic historical quotes into standalone research format
        run: python -m arb_research.import_parquet --input data/archive_copy --output data/historical
      - name: Backtest matched historical quote pairs after illustrative fees
        run: >-
          python -m arb_research.screen
          --input data/historical --contracts 1
          --output outputs/historical_backtest.json
      - name: Preserve evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-historical-backtest
          path: |
            data/historical/manifest.json
            data/historical/markets.jsonl
            data/historical/quotes.jsonl
            outputs/historical_backtest.json
          if-no-files-found: warn
          retention-days: 14
