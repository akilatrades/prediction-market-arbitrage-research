name: Historical arbitrage quote research
on:
  push:
    branches: [main]
    paths:
      - "arb_research/**"
      - "tests/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate formulas and safety guardrails
        run: python -m unittest discover -s tests -v
      - name: Install independent research data readers
        run: python -m pip install pandas pyarrow
      - name: Verify independently stored historical archives
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c data/reference/SHA256SUMS.txt
      - name: Import authentic historical quotes into standalone research format
        run: python -m arb_research.import_parquet --input data/reference --output data/historical
      - name: Backtest matched historical quote pairs after illustrative fees
        run: >-
          python -m arb_research.screen
          --input data/historical --contracts 1
          --output outputs/historical_backtest.json
      - name: Sensitivity — 10 paired contracts (historical depth unverified)
        run: >-
          python -m arb_research.screen
          --input data/historical --contracts 10
          --output outputs/historical_backtest_10_pairs.json
      - name: Sensitivity — 100 paired contracts (historical depth unverified)
        run: >-
          python -m arb_research.screen
          --input data/historical --contracts 100
          --output outputs/historical_backtest_100_pairs.json
      - name: Preserve evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-historical-backtest
          path: |
            data/historical/manifest.json
            data/historical/markets.jsonl
            data/historical/quotes.jsonl
            outputs/historical_backtest*.json
          if-no-files-found: warn
          retention-days: 14
